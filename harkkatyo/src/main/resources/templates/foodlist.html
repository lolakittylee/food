<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Foods</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
  </head>
<body style="padding-left: 40px;">
    <h1>Foods</h1>
<form action="#" th:action="@{/showmodifyform}" th:object="${food}" method="post">
    <table class="table table-striped">
  <tr>
    <th>Id</th>
   <th>Dish</th>
   <th>Restaurant</th>
   <th>Dietary Restriction</th>
   <th>Price</th>
  </tr>
     <tr th:each = "food : ${foods}">
       <td th:text="${food.id}"></td>
       <td th:text="${food.dish}"></td>
       <td th:text="${food.restaurant}"></td>
       <td th:text="${food.dietaryRestriction}"></td>
        <td th:text="${food.price}"></td>
        <td><a class="btn btn-danger" th:href="@{/delete/{id}(id=${food.id})}">Delete</a></td>
        <td><a  th:href="@{/edit/{id}(id=${food.id})}">Edit</a></td>
     </tr>
</table>
<p><input class="btn btn-success" type="submit" value="Add food" /></p>
</form>
</body>
</html>
